# diagram.config.yaml for the Blueprint Deck Kit explaining itself (public example).
version: 2

# ---------------------------------------------------------------- shared by every diagram in the file
project:
  name: "Blueprint Deck Kit"
  subtitle: "How the kit works · architecture"
  maturity: running
  one_liner: "Your agent writes the data; a fixed engine turns it into one HTML file you can present, edit and send."

branding:
  website: ""
  theme: midnight
  primary: "#6366f1"
  secondary: "#22d3ee"
  shape: rounded
  logo: "icon:layers"
  name_rules: ["Say Blueprint Deck Kit for the tool, Blueprint Deck for a generated file"]

sources:
  include:
    - "README.md"
    - "CHANGELOG.md"
    - "CONTRIBUTING.md"
    - "SECURITY.md"
    - "site/src/pages/docs/*"
    - "plugins/blueprint-deck/**"
    - ".claude-plugin/marketplace.json"
    - ".agents/plugins/marketplace.json"
    - "engine/src/*"
    - "dev/*.mjs"
    - "configurator/index.html"
    - "install.sh"
    - "install.ps1"
    - ".github/workflows/*.yml"
    - "site/README.md"
    - "site/public/_redirects"
    - "site/src/pages/index.astro"
    - "video/README.md"
  exclude: ["site/node_modules/**", "site/dist/**", "video/out/**", "video/node_modules/**", "plugins/blueprint-deck/skills/blueprint-deck/blueprint-deck.html", "plugins/blueprint-deck/skills/blueprint-deck/reference/lucide-*.json"]
  priority: ["engine/src/*.js", "plugins/blueprint-deck/skills/blueprint-deck/SKILL.md", "CHANGELOG.md", "README.md", "site/src/pages/docs/*"]
  derive_status_from: []
  on_conflict: report
  cite_sources: true
  invent: never

behaviour:
  hero: true
  tour_position: auto
  zoom_to_focus: true
  edges_filter_by_view: true
  edge_labels: focus
  particles: main-flow
  overview_edges: all
  legend: collapsed
  editor: true
  keyboard: true

workflow:
  confirm_structure: false             # generated unattended; the proposed structure is in extraction-report.md
  pause_after_extract: false
  output: "index.html"

# ---------------------------------------------------------------- one diagram
diagrams:
  - id: kit
    name: "Blueprint Deck Kit"
    type: architecture
    viewpoint: mixed
    focus: "How you get the skill, how an agent generates a Blueprint Deck, what is inside the one HTML file, and how it is edited, presented and shared."

    audience:
      who: [engineers, business]
      goal: "Developers and presenters evaluating the tool understand how it works and what they would do with it"
      tone: technical
      language: en

    sources: {}

    map:
      detail: medium
      external: true
      customer_owned: true             # the user's own repo
      frame_label: "<b>Blueprint Deck Kit</b> · open source (MIT)"
      technology: from-viewpoint
      must_show: ["skill", "config", "extraction report", "checks", "data block", "core / renderer / editor / loader", "PDF export", "sharing", "install channels (plugins, install script, release zips, chat apps)", "dev tooling and releases"]
      leave_out: []
      status:
        enabled: false
        meaning: build
        values: []
      notes: "Users as personas, not as boxes. Reading order: your repo and the agent side on the left, the file in the middle, where it opens on the right; where the skill runs, how you get it and dev tooling along the bottom. engine/src/boot.js is the Loader (not Shell)."

    personas:
      enabled: true
      names: ["Agent user", "Presenter", "Viewer", "Contributor"]

    views:
      presets: []
      custom:
        - "Generate: config and sources → skill → data block, with the checks"
        - "Get the skill: plugin marketplace, install script, release zips, chat apps"
        - "Edit & save: press E, save into the file"
        - "Present & share: tour, PDF, links, phones, Teams/SharePoint, Claude artifact"
        - "Inside the file: data block, loader, core, renderer, editor"
        - "Dev tooling: how the engine file is built, checked and released"

    tour:
      enabled: true
      steps: "8-12"
      story: component-walk
      use_case: ""
      opening: vision
      closing: why-this
      include: []
      notes: ""

    overlays:
      roadmap: { enabled: false, source: "" }
      options: { enabled: false, title: "", source: "" }
      custom: []

    comments: ""

comments: |
  Audience: developers and presenters who are evaluating the tool.
  Versioning: the kit is in beta, version 0.x (currently 0.6.0); 1.0.0 will be the first stable release.
  meta.url is the GitHub repository (https://github.com/lukasvecerka23/blueprint-deck-kit); the website is blueprintdeck.dev.
  Sources are GitHub links (blob/main) to the files in this repository.
