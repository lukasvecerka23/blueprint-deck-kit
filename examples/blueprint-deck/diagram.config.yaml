# diagram.config.yaml for the Blueprint Deck Kit explaining itself (public example).
version: 2

# ---------------------------------------------------------------- shared by every diagram in the file
project:
  name: "Blueprint Deck Kit"
  subtitle: "How the kit works · architecture"
  maturity: running
  one_liner: "Your agent writes the data; a fixed engine turns it into one HTML file you can present, edit and send."

branding:
  website: ""
  theme: midnight
  primary: "#6366f1"
  secondary: "#22d3ee"
  shape: rounded
  logo: "icon:layers"
  name_rules: ["Say Blueprint Deck Kit for the tool, Blueprint Deck for a generated file"]

sources:
  include:
    - "plugins/blueprint-deck/skills/blueprint-deck/SKILL.md"
    - "plugins/blueprint-deck/skills/blueprint-deck/reference/*.md"
    - "plugins/blueprint-deck/skills/blueprint-deck/templates/*"
    - "plugins/blueprint-deck/skills/blueprint-deck/tools/check.mjs"
    - "engine/src/*.js"
    - "engine/src/*.css"
    - "engine/src/template.html"
    - "dev/assemble.mjs"
    - "dev/make-icons.mjs"
    - "configurator/index.html"
  exclude: ["README.md", "dev/old-*"]
  priority: ["plugins/blueprint-deck/skills/blueprint-deck/SKILL.md", "engine/src/*.js"]
  derive_status_from: []
  on_conflict: report
  cite_sources: true
  invent: never

behaviour:
  hero: true
  tour_position: auto
  zoom_to_focus: true
  edges_filter_by_view: true
  edge_labels: focus
  particles: main-flow
  overview_edges: all
  legend: collapsed
  editor: true
  keyboard: true

workflow:
  confirm_structure: false             # generated unattended; the proposed structure is in extraction-report.md
  pause_after_extract: false
  output: "index.html"

# ---------------------------------------------------------------- one diagram
diagrams:
  - id: kit
    name: "Blueprint Deck Kit"
    type: architecture
    viewpoint: mixed
    focus: "How a Blueprint Deck is generated by an agent, what is inside the one HTML file, and how it is edited, presented and shared."

    audience:
      who: [engineers, business]
      goal: "Developers and presenters evaluating the tool understand how it works and what they would do with it"
      tone: technical
      language: en

    sources: {}

    map:
      detail: medium
      external: true
      customer_owned: true             # the user's own repo
      frame_label: "<b>Blueprint Deck Kit</b> · open source (MIT)"
      technology: from-viewpoint
      must_show: ["skill", "config", "extraction report", "checks", "data block", "core / renderer / editor / shell", "PDF export", "sharing", "dev tooling"]
      leave_out: []
      status:
        enabled: false
        meaning: build
        values: []
      notes: "Users as personas, not as boxes. Reading order: your repo and the agent side on the left, the file in the middle, where it opens on the right, dev tooling along the bottom."

    personas:
      enabled: true
      names: ["Agent user", "Presenter", "Viewer", "Contributor"]

    views:
      presets: []
      custom:
        - "Generate: config and sources → skill → data block, with the checks"
        - "Edit & save: press E, save into the file"
        - "Present & share: tour, PDF, link, phones"
        - "Inside the file: data block, shell, core, renderer, editor"
        - "Dev tooling: how the engine file is built"

    tour:
      enabled: true
      steps: "8-12"
      story: component-walk
      use_case: ""
      opening: vision
      closing: why-this
      include: []
      notes: ""

    overlays:
      roadmap: { enabled: false, source: "" }
      options: { enabled: false, title: "", source: "" }
      custom: []

    comments: ""

comments: |
  Audience: developers and presenters who are evaluating the tool. The README is being rewritten; do not use it.
  The configurator is being rebuilt: describe it only as a form that writes diagram.config.yaml and a prompt.
