name: Feature request
description: A diagram type, an option or a workflow that's missing
labels: ["feat"]
title: "feat(): "
body:
  - type: markdown
    attributes:
      value: |
        **Title:** `feat(area): what's wrong or wanted`, lowercase and specific, for example
        `feat(pdf): black and white export`. Areas: `deck`, `editor`, `pdf`, `configurator`, `skill`, `install`, `site`, `docs`, `examples`.
        ([Issue titles](https://github.com/lukasvecerka23/blueprint-deck-kit/blob/main/CONTRIBUTING.md#issues))
  - type: textarea
    id: goal
    attributes:
      label: What do you want to show or do?
      description: The situation, not the solution yet. Who is the deck for and what should they get from it?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: Why can't you do it today?
      description: What did you try (config options, the editor, asking the agent)?
    validations:
      required: true
  - type: textarea
    id: good
    attributes:
      label: What would good look like?
      description: A sketch, a screenshot of something similar or an example deck helps a lot.
  - type: dropdown
    id: area
    attributes:
      label: Which part would it change?
      multiple: true
      options:
        - The deck (what viewers see)
        - The editor
        - PDF export
        - The configurator
        - The skill (how the agent reads and writes)
        - Installing, other agents or apps
        - Not sure
