name: Release
# Push a tag that matches the version in engine/src/core.js (e.g. v2.1.0): this creates a DRAFT GitHub release with
# the CHANGELOG section as notes and the skill + install scripts as files. Publish the draft when you're ready: from
# then on the install scripts (…/releases/latest/download/…) give users this version. See CONTRIBUTING.md → Releasing.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tag matches the version
        run: |
          V=$(sed -n 's/.*const VERSION = "\([^"]*\)".*/\1/p' engine/src/core.js)
          test "v$V" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but engine/src/core.js says $V"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Everything is assembled and clean
        run: |
          node dev/assemble.mjs
          node dev/assemble.mjs --upgrade examples/*/index.html
          git diff --exit-code
          for f in examples/*/index.html; do node plugins/blueprint-deck/skills/blueprint-deck/tools/check.mjs "$f"; done
      - name: Skill archives and release notes
        run: |
          mkdir -p out
          # only the skill folder (the plugin manifests live one level up; the chat apps refuse a skill with a manifest)
          tar -czf out/blueprint-deck-skill.tar.gz -C plugins/blueprint-deck/skills blueprint-deck
          (cd plugins/blueprint-deck/skills && zip -qr ../../../out/blueprint-deck-skill.zip blueprint-deck)
          ! unzip -l out/blueprint-deck-skill.zip | grep -q "plugin.json"
          # the Gemini app accepts only plain-text types it knows: the same skill without tools/ (.mjs)
          (cd plugins/blueprint-deck/skills && zip -qr ../../../out/blueprint-deck-skill-gemini.zip blueprint-deck -x "blueprint-deck/tools/*")
          ! unzip -l out/blueprint-deck-skill-gemini.zip | grep -q -E "/tools/|plugin.json"
          cp install.sh install.ps1 out/
          awk -v v="## $VERSION" '$0 ~ "^## " { p = index($0, v) == 1 } p' CHANGELOG.md | tail -n +2 > out/notes.md
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/blueprint-deck-skill.zip out/blueprint-deck-skill-gemini.zip out/blueprint-deck-skill.tar.gz out/install.sh out/install.ps1 --draft --title "Blueprint Deck Kit $VERSION" --notes-file out/notes.md
