name: Release
# Push a tag that matches the version in engine/src/core.js (e.g. v2.1.0): the release gets the CHANGELOG section
# as notes and the skill as .zip and .tar.gz. See CONTRIBUTING.md → Releasing.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tag matches the version
        run: |
          V=$(sed -n 's/.*const VERSION = "\([^"]*\)".*/\1/p' engine/src/core.js)
          test "v$V" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but engine/src/core.js says $V"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Everything is assembled and clean
        run: |
          node dev/assemble.mjs
          node dev/assemble.mjs --upgrade examples/*/index.html
          git diff --exit-code
          for f in examples/*/index.html; do node skill/blueprint-deck/tools/check.mjs "$f"; done
      - name: Skill archives and release notes
        run: |
          mkdir -p out
          tar -czf out/blueprint-deck-skill-$VERSION.tar.gz -C skill blueprint-deck
          (cd skill && zip -qr ../out/blueprint-deck-skill-$VERSION.zip blueprint-deck)
          awk -v v="## $VERSION" '$0 ~ "^## " { p = index($0, v) == 1 } p' CHANGELOG.md | tail -n +2 > out/notes.md
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/*.zip out/*.tar.gz --title "Blueprint Deck Kit $VERSION" --notes-file out/notes.md
